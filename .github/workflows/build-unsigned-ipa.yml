name: Build unsigned iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Extract game source
        run: unzip -q CloudFlowerRunnerApp-source.zip -d app

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: app
        run: |
          xcodebuild \
            -project CloudFlowerRunner.xcodeproj \
            -scheme CloudFlowerRunner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: app
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CloudFlowerRunner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload CloudFlowerRunner-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlowerRunner-unsigned-ipa
          path: app/CloudFlowerRunner-unsigned.ipa
          if-no-files-found: error
